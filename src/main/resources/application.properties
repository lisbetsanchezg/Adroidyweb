# =====================================================================
# BeautyShop - Configuracion de la aplicacion
# =====================================================================

# Nombre de la aplicacion
spring.application.name=beautyshop-backend

# Puerto donde se expone la API REST (http://localhost:8090)
server.port=8090

# ---------------------------------------------------------------------
# Conexion a la base de datos MySQL (leida por la clase config/DatabaseConfig)
# Cambia usuario, contrasena y nombre de la BD segun tu entorno local.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/beautyshop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# Documentacion Swagger / OpenAPI (springdoc)
#   Interfaz:      http://localhost:8090/swagger-ui.html
#   Especificacion: http://localhost:8090/v3/api-docs
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
